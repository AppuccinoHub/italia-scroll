<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#cfe8f8" id="metaTheme" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Italia Scroll — Italian 3: TikTok-style vertical scroll through Italy. Pick the right caption (Presente, Imperfetto, Passato prossimo)." />
  <meta property="og:title" content="Italia Scroll · Italiano 3" />
  <meta property="og:description" content="Vertical scroll through Italy. Choose the real Italian caption — unlock 4 tense levels." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://appuccinohub.github.io/italia-scroll/og.png" />
  <meta property="og:url" content="https://appuccinohub.github.io/italia-scroll/" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Italia Scroll · Italiano 3</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23cfe8f8'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28'%3E%F0%9F%87%AE%F0%9F%87%B9%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone" role="application" aria-label="Italia Scroll Italian caption practice">
      <header class="app-header">
        <button type="button" class="icon-btn" id="btnHome" aria-label="Home" title="Home" hidden>⌂</button>
        <div class="brand">
          <span class="logo" aria-hidden="true">🇮🇹</span>
          <div>
            <h1>Italia Scroll</h1>
            <p class="subtitle" id="headerSubtitle">For You · Italiano 3</p>
          </div>
        </div>
        <div class="header-actions">
          <button type="button" class="icon-btn" id="btnMute" aria-label="Mute sound" title="Sound">🔇</button>
          <button type="button" class="icon-btn" id="btnTheme" aria-label="Theme: Sky lemon. Tap for Fall" title="Theme: Sky lemon. Tap for Fall">🍂</button>
        </div>
      </header>

      <!-- START -->
      <section class="screen active" id="screenStart" aria-label="Start">
        <div class="hero">
          <div class="hero-tag">4 livelli · ~8–10 min</div>
          <div class="hero-art" aria-hidden="true"></div>
          <p class="hero-pitch">Scorri l’Italia — scegli la <strong>didascalia</strong> giusta.</p>

          <div class="help-panel" id="helpPanelStart">
            <p class="help-label">Livello di aiuto <span class="soft-pill">for everyone</span></p>
            <div class="help-row" role="group" aria-label="Help level">
              <button type="button" class="help-chip" data-help="more">More help</button>
              <button type="button" class="help-chip" data-help="mid" aria-pressed="true">Just right</button>
              <button type="button" class="help-chip" data-help="challenge">Challenge me</button>
            </div>
            <p class="help-hint" id="helpHint">English gloss + clear context under each card.</p>
          </div>

          <div class="level-panel">
            <p class="help-label">Scegli un livello</p>
            <div class="level-list" id="levelList" role="list"></div>
            <p class="level-hint" id="levelHint">Completa un livello per sbloccare il successivo.</p>
          </div>

          <button type="button" class="quick-btn" id="btnQuick">⚡ Quick Play · ≈ 5 min</button>
        </div>
      </section>

      <!-- PLAY — vertical feed -->
      <section class="screen" id="screenPlay" aria-label="Feed" hidden>
        <div class="play-meta">
          <p class="level-badge" id="levelBadge"></p>
          <p class="soft-score" id="softScore" aria-live="polite"></p>
        </div>
        <div class="feed" id="feed" tabindex="0" aria-label="Vertical card feed">
          <!-- cards injected -->
        </div>
        <div class="feed-nav" aria-hidden="false">
          <button type="button" class="nav-btn" id="btnPrev" aria-label="Previous card">↑</button>
          <span class="feed-pos" id="feedPos">1 / 9</span>
          <button type="button" class="nav-btn" id="btnNext" aria-label="Next card">↓</button>
        </div>
      </section>

      <!-- END -->
      <section class="screen" id="screenEnd" aria-label="Level complete" hidden>
        <div class="end-card">
          <p class="end-emoji" aria-hidden="true">✨</p>
          <h2 id="endTitle">Livello completato</h2>
          <p class="end-score" id="endScore"></p>
          <p class="end-note" id="endNote"></p>
          <div class="end-actions">
            <button type="button" class="primary-btn" id="btnReplay">Rifai questo livello</button>
            <button type="button" class="secondary-btn" id="btnNextLevel" hidden>Livello successivo →</button>
            <button type="button" class="ghost-btn" id="btnBackHome">Torna alla home</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="data.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
